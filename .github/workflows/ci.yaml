name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  KAWARIMI_LINUX_CI: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      code: ${{ steps.filter.outputs.code }}
      swift_image: ${{ steps.swift.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'Sources/**'
              - 'Tests/**'
              - 'skills/**'
              - 'docs/**'
              - 'Package.swift'
              - 'Package.resolved'
              - '.swift-version'
              - 'Example/**'
              - 'Scripts/**'
              - '.github/**'
              - '.cursor/**'

      - name: Resolve Swift Docker image
        id: swift
        shell: bash
        run: ./Scripts/swift-docker-image.sh

  kawarimi:
    name: Swift Test (Kawarimi)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ${{ needs.changes.outputs.swift_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            /root/.cache/org.swift.swiftpm
          key: spm-linux-${{ hashFiles('.swift-version') }}-kawarimi-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-linux-${{ hashFiles('.swift-version') }}-kawarimi-
            spm-linux-${{ hashFiles('.swift-version') }}-

      - name: Trust workspace for SwiftPM
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run tests
        run: swift test

      - name: Validate Example scenario fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd Example/DemoPackage
          swift build --product DemoSpecWireExport
          SPEC_SNAPSHOT="$(mktemp)"
          trap 'rm -f "$SPEC_SNAPSHOT"' EXIT
          swift run DemoSpecWireExport > "$SPEC_SNAPSHOT"
          cd "$GITHUB_WORKSPACE"
          swift run KawarimiValidate \
            --config Example/DemoPackage/kawarimi.json.example \
            --scenarios Example/DemoPackage/kawarimi-scenarios.json \
            --spec-snapshot "$SPEC_SNAPSHOT"

  demo-package:
    name: Swift Test (Example/DemoPackage)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.changes.outputs.swift_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Example/DemoPackage/.build
            /root/.cache/org.swift.swiftpm
          key: spm-linux-${{ hashFiles('.swift-version') }}-demo-${{ hashFiles('Example/DemoPackage/Package.resolved', 'Example/DemoPackage/Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-linux-${{ hashFiles('.swift-version') }}-demo-
            spm-linux-${{ hashFiles('.swift-version') }}-

      - name: Trust workspace for SwiftPM
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run tests
        working-directory: Example/DemoPackage
        run: swift test

  macos:
    name: Swift Test (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      # Package.swift drops KawarimiHenge / HengeCli when this is "1" (workflow default).
      KAWARIMI_LINUX_CI: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift version
        id: swift-version
        shell: bash
        run: |
          swift --version
          echo "value=$(swift --version | shasum -a 256 | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"

      # Keyed on the toolchain so a runner Xcode update does not restore an incompatible .build.
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            Example/DemoPackage/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-macos-${{ steps.swift-version.outputs.value }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Example/DemoPackage/Package.resolved', 'Example/DemoPackage/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-macos-${{ steps.swift-version.outputs.value }}-

      - name: Build package (includes KawarimiHenge)
        run: swift build

      - name: Run macOS-only code path tests
        shell: bash
        run: |
          set -euo pipefail
          suites=(KawarimiProxyURLSessionTransportIntegrationTests KawarimiConfigFileWatcherTests)
          listed="$(swift test list)"
          # `swift test --filter` exits 0 when nothing matches, so a renamed suite would pass silently.
          for suite in "${suites[@]}"; do
            if ! grep -q "\.${suite}/" <<<"${listed}"; then
              echo "::error::Test suite ${suite} not found in swift test list"
              exit 1
            fi
          done
          swift test --skip-build --filter "$(IFS='|'; echo "${suites[*]}")"

      - name: Build HengeCli
        working-directory: Example/DemoPackage
        run: swift build --product HengeCli

  swift-test:
    name: Swift Test
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [changes, kawarimi, demo-package, macos]
    if: always()
    steps:
      - name: Gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          KAWARIMI: ${{ needs.kawarimi.result }}
          DEMO: ${{ needs.demo-package.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes job failed; refusing to green-light (CHANGES_RESULT=$CHANGES_RESULT)"
            exit 1
          fi
          if [ "$CODE" != "true" ]; then
            echo "No code-related paths in this PR; skipping Swift test jobs. Required check still passes."
            exit 0
          fi
          if [ "$KAWARIMI" != "success" ] || [ "$DEMO" != "success" ] || [ "$MACOS" != "success" ]; then
            echo "Expected test jobs to succeed; got KAWARIMI=$KAWARIMI DEMO=$DEMO MACOS=$MACOS"
            exit 1
          fi
          echo "OK"
