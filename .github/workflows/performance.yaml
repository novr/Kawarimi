name: Performance

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KAWARIMI_LINUX_CI: "1"

jobs:
  resolve-swift:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      image: ${{ steps.swift.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Swift Docker image
        id: swift
        shell: bash
        run: ./Scripts/swift-docker-image.sh

  run:
    needs: resolve-swift
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-swift.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            Example/DemoPackage/.build
            /root/.cache/org.swift.swiftpm
          key: spm-linux-${{ hashFiles('.swift-version') }}-perf-${{ hashFiles('Package.resolved', 'Package.swift', 'Example/DemoPackage/Package.resolved', 'Example/DemoPackage/Package.swift') }}
          restore-keys: |
            spm-linux-${{ hashFiles('.swift-version') }}-perf-
            spm-linux-${{ hashFiles('.swift-version') }}-

      - name: Trust workspace for SwiftPM
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Incremental build
        run: ./Scripts/performance/incremental-build.sh --clean
